          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen(vm: MainViewModel, onOpenDownloads: () -> Unit) {
              val context = LocalContext.current
              val link by vm.link.collectAsState()
              val downloads by vm.store.items.collectAsState()
              val settings by vm.prefs.state.collectAsState()

              // Clipboard is only *offered*, never pasted behind your back.
              var suggestion by remember { mutableStateOf("") }
              var suggestionDismissed by rememberSaveable { mutableStateOf(false) }
              LaunchedEffect(settings.autoDetectClipboard, link) {
                  if (!settings.autoDetectClipboard || link.isNotBlank() || suggestionDismissed) {
                      suggestion = ""
                      return@LaunchedEffect
                  }
                  val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as? ClipboardManager
                  val text = cm?.primaryClip?.getItemAt(0)?.coerceToText(context)?.toString().orEmpty().trim()
                  suggestion = if (text.contains("instagram.com")) text else ""
              }

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp)) {
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          Modifier.size(34.dp).clip(RoundedCornerShape(10.dp)).background(BrandGradient),
                          contentAlignment = Alignment.Center
                      ) { Icon(Icons.Default.Download, null, tint = Color.White, modifier = Modifier.size(20.dp)) }
                      Spacer(Modifier.width(10.dp))
                      Row {
