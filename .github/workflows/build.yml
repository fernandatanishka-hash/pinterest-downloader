          fun DownloadsScreen(vm: MainViewModel, onOpenStorage: () -> Unit) {
              val all by vm.store.items.collectAsState()
              var filter by remember { mutableStateOf("All") }
              var query by rememberSaveable { mutableStateOf("") }

              val items = remember(all, filter, query) {
                  val byType = when (filter) {
                      "Reels" -> all.filter { it.fileName.startsWith("reels") }
                      "Photos" -> all.filter { it.kind == MediaKind.PHOTO }
                      "Videos" -> all.filter { it.kind == MediaKind.VIDEO }
                      else -> all
                  }
                  if (query.isBlank()) byType else byType.filter {
                      it.fileName.contains(query, true) ||
                          it.username.contains(query, true) ||
                          it.collection.contains(query, true)
                  }
              }

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp)) {
                  Spacer(Modifier.height(14.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Downloads", style = MaterialTheme.typography.titleLarge, color = TextHi)
                      Spacer(Modifier.weight(1f))
                      IconButton(onClick = onOpenStorage) { Icon(Icons.Default.Settings, null, tint = TextLo) }
                  }
                  Spacer(Modifier.height(10.dp))
                  SearchField(query, { query = it }, "Search downloads...")
                  Spacer(Modifier.height(10.dp))
                  LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(FILTERS) { f ->
                          val sel = f == filter
                          Text(
                              f,
                              color = if (sel) Color.White else TextLo,
                              style = MaterialTheme.typography.bodySmall,
                              modifier = Modifier
                                  .clip(RoundedCornerShape(50))
                                  .then(
                                      if (sel) Modifier.background(BrandGradient)
                                      else Modifier.background(InkCard)
                                  )
                                  .clickable { filter = f }
                                  .padding(horizontal = 16.dp, vertical = 8.dp)
                          )
                      }
                  }
                  Spacer(Modifier.height(14.dp))

                  if (items.isEmpty()) {
                      EmptyState(
                          if (query.isBlank()) "No downloads yet" else "No matches",
                          if (query.isBlank()) "Paste a link on the Home tab to get started."
                          else "Nothing here matches \"$query\"."
                      )
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          items(items, key = { it.id }) { rec -> DownloadRow(rec, vm) }
                          item { Spacer(Modifier.height(10.dp)) }
                      }
                  }
              }
          }

          @Composable
          fun EmptyState(title: String, subtitle: String) {
              Column(
                  Modifier.fillMaxWidth().padding(top = 70.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
