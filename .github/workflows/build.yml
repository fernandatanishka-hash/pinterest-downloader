                          Text("Snap", style = MaterialTheme.typography.titleLarge, color = NeonPink)
                      }
                      Spacer(Modifier.weight(1f))
                      Icon(Icons.Default.WorkspacePremium, null, tint = Color(0xFFFFC53D))
                  }

                  Spacer(Modifier.height(18.dp))
                  OutlinedTextField(
                      value = link,
                      onValueChange = vm::setLink,
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text("Paste Instagram link here...", color = TextLo) },
                      leadingIcon = { Icon(Icons.Default.Link, null, tint = NeonPurple) },
                      trailingIcon = {
                          if (link.isNotEmpty()) {
                              IconButton(onClick = { vm.setLink("") }) {
                                  Icon(Icons.Default.Close, null, tint = TextLo)
                              }
                          }
                      },
                      singleLine = true,
                      shape = RoundedCornerShape(16.dp),
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go),
                      colors = OutlinedTextFieldDefaults.colors(
                          focusedContainerColor = InkCard,
                          unfocusedContainerColor = InkCard,
                          focusedBorderColor = NeonPurple,
                          unfocusedBorderColor = Stroke,
                          focusedTextColor = TextHi,
                          unfocusedTextColor = TextHi
                      )
                  )

                  if (suggestion.isNotBlank()) {
                      Spacer(Modifier.height(8.dp))
                      NeonCard {
                          Row(
                              Modifier
                                  .fillMaxWidth()
                                  .clickable {
                                      vm.setLink(suggestion)
                                      suggestion = ""
                                  }
                                  .padding(horizontal = 12.dp, vertical = 10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(Icons.Default.ContentPaste, null, tint = NeonPurple, modifier = Modifier.size(18.dp))
                              Spacer(Modifier.width(10.dp))
                              Column(Modifier.weight(1f)) {
                                  Text("Link copied — tap to use", color = TextHi,
                                      style = MaterialTheme.typography.bodySmall)
                                  Text(suggestion, color = TextLo, maxLines = 1,
                                      style = MaterialTheme.typography.bodySmall)
                              }
                              IconButton(onClick = {
                                  suggestion = ""
                                  suggestionDismissed = true
                              }) { Icon(Icons.Default.Close, null, tint = TextLo) }
                          }
                      }
                  }

                  Spacer(Modifier.height(14.dp))
                  GradientButton(
                      text = "Download",
                      modifier = Modifier.fillMaxWidth(),
                      icon = Icons.Default.Download,
                      onClick = { vm.resolve() }
                  )

                  Spacer(Modifier.height(20.dp))
                  Row(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      QuickTile(Icons.Default.Movie, "Reels")
                      QuickTile(Icons.Default.Image, "Photos")
                      QuickTile(Icons.Default.RadioButtonUnchecked, "Stories")
                      QuickTile(Icons.Default.Videocam, "Videos")
                  }

                  Spacer(Modifier.height(22.dp))
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Text("Recent Downloads", color = TextHi, fontWeight = FontWeight.SemiBold)
                      Spacer(Modifier.weight(1f))
                      Text(
                          "See all",
                          color = NeonPurple,
                          style = MaterialTheme.typography.bodySmall,
                          modifier = Modifier.clickable { onOpenDownloads() }
                      )
                  }
                  Spacer(Modifier.height(10.dp))

                  if (downloads.isEmpty()) {
                      NeonCard {
                          Column(
                              Modifier.fillMaxWidth().padding(24.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Icon(Icons.Outlined.CloudDownload, null, tint = TextLo, modifier = Modifier.size(34.dp))
