          import androidx.compose.ui.unit.dp
          import coil.compose.AsyncImage
          import com.flowsnap.app.data.MediaKind
          import com.flowsnap.app.data.ResolveState
          import com.flowsnap.app.ui.MainViewModel
          import com.flowsnap.app.ui.components.*
          import com.flowsnap.app.ui.theme.*

          @Composable
          fun PreviewScreen(vm: MainViewModel, onBack: () -> Unit) {
              val state by vm.state.collectAsState()
              val index by vm.selectedIndex.collectAsState()
              val progress by vm.downloadProgress.collectAsState()

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp).verticalScroll(rememberScrollState())) {
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null, tint = TextHi) }
                      Text("Preview & Download", color = TextHi, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(8.dp))

                  when (val s = state) {
                      is ResolveState.Loading -> LoadingBlock()
                      is ResolveState.Error -> ErrorBlock(s.message) { vm.resolve() }
                      is ResolveState.Success -> {
                          val post = s.post
                          val item = post.items.getOrElse(index) { post.items.first() }
                          var selectedVariant by remember(item.id) { mutableStateOf(item.variants.firstOrNull()) }

                          Box(
                              Modifier.fillMaxWidth().height(230.dp)
                                  .clip(RoundedCornerShape(18.dp)).background(InkCard2),
                              contentAlignment = Alignment.Center
                          ) {
                              AsyncImage(
                                  model = item.thumbnailUrl,
                                  contentDescription = null,
                                  modifier = Modifier.fillMaxSize(),
                                  contentScale = ContentScale.Crop
                              )
                              if (item.kind == MediaKind.VIDEO) {
                                  Box(
                                      Modifier.size(56.dp).clip(CircleShape)
                                          .background(Color.Black.copy(alpha = .45f)),
                                      contentAlignment = Alignment.Center
                                  ) { Icon(Icons.Default.PlayArrow, null, tint = Color.White, modifier = Modifier.size(32.dp)) }
                              }
                              if (item.durationSec > 0) {
                                  Text(
                                      formatDuration(item.durationSec),
                                      color = Color.White,
                                      style = MaterialTheme.typography.bodySmall,
                                      modifier = Modifier.align(Alignment.BottomEnd).padding(10.dp)
                                          .background(Color.Black.copy(alpha = .55f), RoundedCornerShape(6.dp))
                                          .padding(horizontal = 6.dp, vertical = 2.dp)
                                  )
                              }
                          }

                          if (post.items.size > 1) {
                              Spacer(Modifier.height(10.dp))
                              LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  itemsIndexed(post.items) { i, it ->
                                      AsyncImage(
                                          model = it.thumbnailUrl,
                                          contentDescription = null,
                                          contentScale = ContentScale.Crop,
                                          modifier = Modifier.size(58.dp)
                                              .clip(RoundedCornerShape(10.dp))
                                              .border(
                                                  2.dp,
                                                  if (i == index) NeonPink else Stroke,
                                                  RoundedCornerShape(10.dp)
                                              )
                                              .clickable { vm.selectIndex(i) }
                                      )
                                  }
                              }
                          }

                          Spacer(Modifier.height(14.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              AsyncImage(
                                  model = post.avatarUrl,
                                  contentDescription = null,
                                  modifier = Modifier.size(34.dp).clip(CircleShape).background(InkCard2)
                              )
                              Spacer(Modifier.width(10.dp))
                              Column {
                                  Text("@${post.username}", color = TextHi, style = MaterialTheme.typography.bodyMedium)
                                  Text(
                                      buildString {
                                          append(if (item.kind == MediaKind.VIDEO) "Reel" else "Photo")
                                          if (item.durationSec > 0) append(" • ${formatDuration(item.durationSec)}")
                                          selectedVariant?.let { append(" • ${formatSize(it.approxBytes)}") }
                                      },
                                      color = TextLo,
                                      style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }

                          Spacer(Modifier.height(16.dp))
                          Text("Download Quality", color = TextHi, fontWeight = FontWeight.SemiBold)
                          Spacer(Modifier.height(8.dp))
                          item.variants.forEachIndexed { i, v ->
                              val selected = v == selectedVariant
                              NeonCard(
                                  modifier = Modifier.padding(bottom = 8.dp).clickable { selectedVariant = v },
                                  selected = selected
                              ) {
                                  Row(
                                      Modifier.fillMaxWidth().padding(14.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(
                                          selected = selected,
                                          onClick = { selectedVariant = v },
                                          colors = RadioButtonDefaults.colors(selectedColor = NeonPurple)
                                      )
                                      Spacer(Modifier.width(6.dp))
                                      Column(Modifier.weight(1f)) {
                                          Text(v.label, color = TextHi, style = MaterialTheme.typography.bodyMedium)
                                          if (v.height > 0) {
                                              Text("${v.width}×${v.height}", color = TextLo, style = MaterialTheme.typography.bodySmall)
                                          }
                                      }
                                      if (i == 0) {
                                          Text(
                                              "Recommended",
                                              color = NeonPink,
                                              style = MaterialTheme.typography.labelSmall,
                                              modifier = Modifier
                                                  .background(NeonPink.copy(alpha = .14f), RoundedCornerShape(8.dp))
                                                  .padding(horizontal = 8.dp, vertical = 3.dp)
                                          )
                                          Spacer(Modifier.width(8.dp))
                                      }
                                      Text(formatSize(v.approxBytes), color = TextLo, style = MaterialTheme.typography.bodySmall)
                                  }
                              }
                          }

                          progress?.let { p ->
                              if (!p.done) {
                                  LinearProgressIndicator(
                                      progress = { p.percent / 100f },
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp),
                                      color = NeonPink,
                                      trackColor = Stroke
                                  )
                                  Text("${p.percent}% • ${p.fileName}", color = TextLo, style = MaterialTheme.typography.bodySmall)
                              }
                          }

                          Spacer(Modifier.height(10.dp))
                          GradientButton(
                              text = "Download",
                              modifier = Modifier.fillMaxWidth(),
                              icon = Icons.Default.Download,
                              enabled = selectedVariant != null
                          ) {
                              selectedVariant?.let { vm.download(post, item, it, index) }
                          }

                          if (post.items.size > 1) {
                              Spacer(Modifier.height(10.dp))
                              OutlinedButton(
                                  onClick = { vm.downloadAll(post) },
                                  modifier = Modifier.fillMaxWidth().height(50.dp),
                                  shape = RoundedCornerShape(16.dp),
                                  border = androidx.compose.foundation.BorderStroke(1.dp, NeonPurple)
                              ) { Text("Download all ${post.items.size} items", color = NeonPurple) }
                          }
                          Spacer(Modifier.height(24.dp))
                      }
                      ResolveState.Idle -> Unit
                  }
              }
          }

          @Composable
          private fun LoadingBlock() {
              Column(
                  Modifier.fillMaxWidth().padding(top = 80.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  CircularProgressIndicator(color = NeonPink)
                  Spacer(Modifier.height(14.dp))
                  Text("Fetching media…", color = TextLo)
              }
          }

          @Composable
          private fun ErrorBlock(message: String, onRetry: () -> Unit) {
              NeonCard(modifier = Modifier.padding(top = 40.dp)) {
                  Column(Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Icon(Icons.Default.ErrorOutline, null, tint = NeonRose, modifier = Modifier.size(38.dp))
                      Spacer(Modifier.height(10.dp))
                      Text(message, color = TextLo, style = MaterialTheme.typography.bodySmall)
                      Spacer(Modifier.height(14.dp))
                      GradientButton("Try again", Modifier.fillMaxWidth()) { onRetry() }
                  }
              }
          }
          FLOWSNAP_EOF

