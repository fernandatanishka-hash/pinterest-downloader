          class MainActivity : ComponentActivity() {

              private val vm: MainViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  setContent {
                      val settings by vm.prefs.state.collectAsState()

                      val permissionLauncher = rememberLauncher()
                      LaunchedEffect(Unit) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              permissionLauncher("android.permission.POST_NOTIFICATIONS")
                          } else if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P) {
                              permissionLauncher("android.permission.WRITE_EXTERNAL_STORAGE")
                          }
                          vm.handleIntent(intent)
                      }

                      // Status / navigation bar icons must flip with the theme too.
                      LaunchedEffect(settings.darkMode) {
                          enableEdgeToEdge(
                              statusBarStyle = if (settings.darkMode) {
                                  SystemBarStyle.dark(android.graphics.Color.TRANSPARENT)
                              } else {
                                  SystemBarStyle.light(
