          package com.flowsnap.app.data

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import androidx.core.content.FileProvider
          import java.io.File

          /** Open / share / delete a saved download, handling both MediaStore and file:// URIs. */
          object MediaActions {

              private fun mime(record: DownloadRecord) =
                  if (record.kind == MediaKind.VIDEO) "video/*" else "image/*"

              /** file:// URIs cannot be handed to other apps on Android 7+, wrap them. */
              private fun shareableUri(context: Context, record: DownloadRecord): Uri? {
                  val uri = runCatching { Uri.parse(record.localUri) }.getOrNull() ?: return null
                  if (uri.scheme != "file") return uri
                  val file = uri.path?.let { File(it) } ?: return null
                  if (!file.exists()) return null
                  return runCatching {
                      FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                  }.getOrNull()
              }

              fun open(context: Context, record: DownloadRecord, onError: (String) -> Unit) {
                  val uri = shareableUri(context, record) ?: run {
                      onError("File is no longer on this device")
                      return
                  }
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, mime(record))
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  runCatching { context.startActivity(intent) }
                      .onFailure { onError("No app can open this file") }
              }

              fun share(context: Context, record: DownloadRecord, onError: (String) -> Unit) {
                  val uri = shareableUri(context, record) ?: run {
                      onError("File is no longer on this device")
                      return
                  }
                  val intent = Intent(Intent.ACTION_SEND).apply {
                      type = mime(record)
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  runCatching {
                      context.startActivity(
                          Intent.createChooser(intent, "Share ${record.fileName}")
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  }.onFailure { onError("Could not share this file") }
              }

              /** Really removes the file from the gallery. Returns true when something was deleted. */
              fun delete(context: Context, record: DownloadRecord): Boolean = runCatching {
                  val uri = Uri.parse(record.localUri)
                  if (uri.scheme == "file") {
                      uri.path?.let { File(it).delete() } ?: false
                  } else {
                      context.contentResolver.delete(uri, null, null) > 0
                  }
              }.getOrDefault(false)
          }
