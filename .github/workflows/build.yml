          PROJECT_ARCHIVE
          base64 --decode /tmp/pinvela-project.b64 > /tmp/pinvela-project.zip
          unzip -oq /tmp/pinvela-project.zip -d "$GITHUB_WORKSPACE"
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.jar
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build PinVela APK
        shell: bash
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          sed -i '/^org.gradle.workers.max=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'org.gradle.workers.max=2' >> gradle.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PinVela.apk
          test -s PinVela.apk
      - name: Upload PinVela APK
        uses: actions/upload-artifact@v4
        with:
          name: PinVela
          path: PinVela.apk
          if-no-files-found: error
