              <color name="ic_launcher_background">#1A0B2E</color>
          </resources>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/strings.xml <<'FLOWSNAP_EOF'
          <resources>
              <string name="app_name">FlowSnap</string>
          </resources>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/themes.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FlowSnap" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0B0718</item>
                  <item name="android:navigationBarColor">#0B0718</item>
                  <item name="android:windowBackground">#0B0718</item>
              </style>
          </resources>
          FLOWSNAP_EOF


      - name: Write app source (data layer)
        working-directory: build-src
        run: |
          cat > app/src/main/java/com/flowsnap/app/data/DownloadStore.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          /** Tiny JSON-file backed store for the Downloads / Favorites screens. */
          class DownloadStore(context: Context) {

              private val file = File(context.filesDir, "downloads.json")
              private val _items = MutableStateFlow<List<DownloadRecord>>(emptyList())
              val items: StateFlow<List<DownloadRecord>> = _items

              init {
                  _items.value = load()
              }

              fun add(record: DownloadRecord) {
                  _items.value = listOf(record) + _items.value
                  persist()
              }

              fun remove(id: Long) {
                  _items.value = _items.value.filterNot { it.id == id }
                  persist()
              }

              fun toggleFavorite(id: Long) {
                  _items.value = _items.value.map {
                      if (it.id == id) it.copy(favorite = !it.favorite) else it
                  }
                  persist()
              }

              fun setCollection(id: Long, collection: String) {
                  _items.value = _items.value.map {
                      if (it.id == id) it.copy(collection = collection, favorite = true) else it
                  }
                  persist()
              }

              fun clearAll() {
                  _items.value = emptyList()
                  persist()
              }

              fun totalBytes(): Long = _items.value.sumOf { it.sizeBytes }

              private fun persist() {
                  runCatching {
                      val arr = JSONArray()
                      _items.value.forEach { r ->
                          arr.put(
                              JSONObject()
                                  .put("id", r.id)
                                  .put("fileName", r.fileName)
                                  .put("localUri", r.localUri)
                                  .put("remoteUrl", r.remoteUrl)
                                  .put("thumbnailUrl", r.thumbnailUrl)
                                  .put("kind", r.kind.name)
                                  .put("sizeBytes", r.sizeBytes)
                                  .put("createdAt", r.createdAt)
                                  .put("username", r.username)
                                  .put("favorite", r.favorite)
                                  .put("collection", r.collection)
                          )
                      }
                      file.writeText(arr.toString())
                  }
              }

              private fun load(): List<DownloadRecord> = runCatching {
                  if (!file.exists()) return emptyList()
                  val arr = JSONArray(file.readText())
                  (0 until arr.length()).mapNotNull { i ->
                      val o = arr.optJSONObject(i) ?: return@mapNotNull null
                      DownloadRecord(
                          id = o.optLong("id"),
                          fileName = o.optString("fileName"),
                          localUri = o.optString("localUri"),
                          remoteUrl = o.optString("remoteUrl"),
                          thumbnailUrl = o.optString("thumbnailUrl"),
                          kind = runCatching { MediaKind.valueOf(o.optString("kind")) }
                              .getOrDefault(MediaKind.PHOTO),
                          sizeBytes = o.optLong("sizeBytes"),
                          createdAt = o.optLong("createdAt"),
                          username = o.optString("username"),
                          favorite = o.optBoolean("favorite"),
                          collection = o.optString("collection")
                      )
                  }
              }.getOrDefault(emptyList())
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/data/Downloader.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import android.content.ContentValues
          import android.content.Context
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.withContext
          import okhttp3.Request
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream

          data class Progress(val id: String, val fileName: String, val percent: Int, val done: Boolean = false)

          object Downloader {

              /** Live progress of the item currently downloading (null when idle). */
              val progress = MutableStateFlow<Progress?>(null)

              fun fileNameFor(post: ResolvedPost, item: MediaItem, index: Int): String {
                  val stamp = java.text.SimpleDateFormat("yyyyMMdd_HHmmss", java.util.Locale.US)
                      .format(java.util.Date())
                  val ext = if (item.kind == MediaKind.VIDEO) "mp4" else "jpg"
                  val prefix = if (item.kind == MediaKind.VIDEO) {
                      if (post.isReel) "reels" else "video"
                  } else "photo"
                  val suffix = if (post.items.size > 1) "_${index + 1}" else ""
                  return "${prefix}_${stamp}$suffix.$ext"
              }

              /**
               * Streams [variant] to the public gallery (Movies/FlowSnap or Pictures/FlowSnap)
               * and returns a [DownloadRecord] describing the saved file.
               */
              suspend fun download(
                  context: Context,
                  post: ResolvedPost,
                  item: MediaItem,
                  variant: MediaVariant,
                  fileName: String
              ): Result<DownloadRecord> = withContext(Dispatchers.IO) {
                  runCatching {
                      progress.value = Progress(item.id, fileName, 0)

                      val req = Request.Builder()
                          .url(variant.url)
                          .header("User-Agent", Net.UA)
                          .header("Referer", "https://www.instagram.com/")
                          .build()

                      Net.client.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) error("Server returned HTTP ${resp.code}")
                          val body = resp.body ?: error("Empty response")
                          val total = body.contentLength()

                          val sink = openSink(context, fileName, item.kind)
                          var written = 0L
                          var lastPercent = -1
                          body.byteStream().use { input ->
                              sink.stream.use { output ->
                                  val buf = ByteArray(DEFAULT_BUFFER_SIZE)
                                  while (true) {
                                      val read = input.read(buf)
                                      if (read <= 0) break
                                      output.write(buf, 0, read)
                                      written += read
                                      if (total > 0) {
                                          val pct = ((written * 100) / total).toInt()
                                          // only emit on whole-percent changes, otherwise the UI
                                          // recomposes thousands of times per download
                                          if (pct != lastPercent) {
                                              lastPercent = pct
                                              progress.value = Progress(item.id, fileName, pct)
                                          }
                                      }
                                  }
                                  output.flush()
                              }
                          }
                          sink.finish(context)
                          progress.value = Progress(item.id, fileName, 100, done = true)

                          DownloadRecord(
                              id = System.currentTimeMillis(),
                              fileName = fileName,
                              localUri = sink.uri.toString(),
                              remoteUrl = variant.url,
                              thumbnailUrl = item.thumbnailUrl,
                              kind = item.kind,
                              sizeBytes = written,
                              createdAt = System.currentTimeMillis(),
                              username = post.username
                          )
                      }
                  }.also { if (it.isFailure) progress.value = null }
              }

              private class Sink(val uri: Uri, val stream: OutputStream, val onFinish: (Context) -> Unit) {
                  fun finish(context: Context) = onFinish(context)
              }

              private fun openSink(context: Context, fileName: String, kind: MediaKind): Sink {
                  val isVideo = kind == MediaKind.VIDEO
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val collection = if (isVideo) {
                          MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      } else {
                          MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                          put(MediaStore.MediaColumns.MIME_TYPE, if (isVideo) "video/mp4" else "image/jpeg")
                          put(
                              MediaStore.MediaColumns.RELATIVE_PATH,
                              (if (isVideo) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_PICTURES) + "/FlowSnap"
                          )
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val resolver = context.contentResolver
                      val uri = resolver.insert(collection, values) ?: error("Cannot create file in gallery")
                      val out = resolver.openOutputStream(uri) ?: error("Cannot open output stream")
                      Sink(uri, out) { ctx ->
                          val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                          ctx.contentResolver.update(uri, done, null, null)
                      }
                  } else {
                      val dir = File(
                          Environment.getExternalStoragePublicDirectory(
                              if (isVideo) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_PICTURES
                          ),
                          "FlowSnap"
                      )
                      if (!dir.exists()) dir.mkdirs()
                      val file = File(dir, fileName)
                      Sink(Uri.fromFile(file), FileOutputStream(file)) { ctx ->
                          MediaScannerConnection.scanFile(ctx, arrayOf(file.absolutePath), null, null)
                      }
                  }
              }
          }
          FLOWSNAP_EOF

          cat > app/src/main/java/com/flowsnap/app/data/InstagramResolver.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.data

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.FormBody
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * Resolves a public Instagram post / reel / IGTV link into direct media URLs.
           *
           * Instagram keeps changing which public surface answers anonymously, so several
           * strategies are tried in order and the failure reason of each one is kept for
           * the error message:
           *
           *   1. web API      `www.instagram.com/api/v1/media/<id>/info/`
           *   2. GraphQL POST `www.instagram.com/graphql/query` (doc_id)
           *   3. GraphQL GET  same query as a plain GET
           *   4. embed page   `www.instagram.com/p/<code>/embed/captioned/`
           *   5. OpenGraph    meta tags on the post page
           *   6. app API      `i.instagram.com/api/v1/media/<id>/info/` (only with a sessionid)
           */
          object InstagramResolver {

              /** doc_id for PolarisPostActionLoadPostQueryQuery. Update here if it ever rotates. */
              private const val DOC_ID = "8845758582119845"

              private val STORY_RE = Regex("""instagram\.com/stories/[^/]+/(\d+)""")
              private val SHORTCODE_RE =
                  Regex("""instagram\.com/(?:[A-Za-z0-9_.]+/)?(?:p|reel|reels|tv|share)/([A-Za-z0-9_-]+)""")

              fun extractShortcode(input: String): String? {
                  val url = input.trim()
                  SHORTCODE_RE.find(url)?.let { return it.groupValues[1] }
                  if (url.matches(Regex("""^[A-Za-z0-9_-]{8,16}$"""))) return url
                  return null
              }

              fun findUrlInText(text: String): String? =
                  Regex("""https?://\S+""").find(text)?.value?.trimEnd('.', ',', ')')

              suspend fun resolve(rawInput: String): Result<ResolvedPost> = withContext(Dispatchers.IO) {
                  var input = findUrlInText(rawInput) ?: rawInput.trim()

                  // share links (instagram.com/share/XXXX) redirect to the real post
                  if (input.contains("/share/")) {
                      input = runCatching { finalUrlOf(input) }.getOrDefault(input)
                  }

                  if (input.contains("/stories/")) {
                      val storyId = STORY_RE.find(input)?.groupValues?.get(1)
                      return@withContext when {
                          Net.sessionId.isBlank() -> Result.failure(
                              IllegalArgumentException(
                                  "Stories and Highlights need a logged-in account. Open Settings → " +
                                      "Instagram account, log in once, then try again."
                              )
                          )
                          storyId == null -> Result.failure(
                              IllegalArgumentException("Open the story and copy its full link (it must end with the story id).")
                          )
                          else -> runCatching { viaAppApi(storyId, input) }
                      }
                  }

                  val code = extractShortcode(input)
                      ?: return@withContext Result.failure(
                          IllegalArgumentException("That doesn't look like an Instagram post or reel link.")
                      )
                  val mediaId = mediaIdOf(code)

                  val attempts = buildList<Pair<String, () -> ResolvedPost>> {
                      add("web-api" to { viaWebApi(mediaId, input) })
                      add("graphql" to { viaGraphqlPost(code, input) })
                      add("graphql-get" to { viaGraphqlGet(code, input) })
                      add("embed" to { viaEmbed(code, input) })
                      add("page-json" to { viaPageJson(code, input) })
                      // Public embed proxies — these are what make it work without a login.
                      val isReelLink = Regex("/(reel|reels|tv)/").containsMatchIn(input)
                      MIRRORS.forEach { host ->
                          add(host to { viaMirror(host, code, isReelLink, input) })
                      }
                      add("opengraph" to { viaOpenGraph(code, input) })
                      if (Net.sessionId.isNotBlank()) add("app-api" to { viaAppApi(mediaId, input) })
                  }

                  // A /reel/ or /tv/ link must come back as a video. Some fallbacks can only
                  // see the cover image — never hand that back as if it were the post.
                  val wantsVideo = Regex("/(reel|reels|tv)/").containsMatchIn(input)
                  var coverOnly: ResolvedPost? = null

                  val reasons = mutableListOf<String>()
                  for ((name, run) in attempts) {
                      val r = runCatching { run() }
                      val post = r.getOrNull()
                      if (post != null && post.items.any { it.variants.isNotEmpty() }) {
                          val hasVideo = post.items.any { it.kind == MediaKind.VIDEO }
                          if (!wantsVideo || hasVideo) return@withContext Result.success(post)
                          if (coverOnly == null) coverOnly = post
                          reasons += "$name: cover image only"
                          continue
                      }
                      reasons += "$name: ${r.exceptionOrNull()?.message?.take(60) ?: "empty"}"
                  }

                  coverOnly?.let {
                      return@withContext Result.failure(
                          IllegalStateException(
                              "Only the cover image of this reel could be read — Instagram hides the video " +
                                  "file from logged-out requests.\n\nFix: Settings → Instagram session → paste " +
                                  "your sessionid cookie, then try again.\n\nDetails — " +
                                  reasons.joinToString(" · ")
                          )
                      )
                  }

                  Result.failure(
                      IllegalStateException(
                          "Instagram refused every public endpoint for this link.\n\n" +
                              (if (Net.sessionId.isBlank())
                                  "Fix: open Settings → Instagram account and log in once — " +
                                      "that makes posts, reels and stories work again.\n\n"
                              else
                                  "Your saved session may have expired — open Settings → Instagram " +
                                      "account and log in again.\n\n") +
                              "Details — " + reasons.joinToString(" · ")
                      )
                  )
              }

              // ------------------------------------------------------------ strategy 1/6

              private fun viaWebApi(mediaId: String, source: String): ResolvedPost {
                  val body = getText(
                      "https://www.instagram.com/api/v1/media/$mediaId/info/",
                      referer = source
                  )
                  return parseApiPayload(body, mediaId, source)
              }

              private fun viaAppApi(mediaId: String, source: String): ResolvedPost {
                  val body = getText(
                      "https://i.instagram.com/api/v1/media/$mediaId/info/",
                      referer = source,
                      appUa = true
                  )
                  return parseApiPayload(body, mediaId, source)
              }

              private fun parseApiPayload(body: String, mediaId: String, source: String): ResolvedPost {
                  val node = JSONObject(body).optJSONArray("items")?.optJSONObject(0)
                      ?: error("no items")
                  val user = node.optJSONObject("user")
                  val children = node.optJSONArray("carousel_media")
                  val items = if (children != null && children.length() > 0) {
                      (0 until children.length()).mapNotNull { i ->
                          children.optJSONObject(i)?.let { apiNodeToItem(it, "$mediaId-${i + 1}") }
                      }
                  } else {
                      listOf(apiNodeToItem(node, mediaId))
                  }
                  return ResolvedPost(
                      shortcode = node.optString("code", mediaId),
                      username = user?.optString("username").orEmpty().ifBlank { "instagram" },
                      avatarUrl = user?.optString("profile_pic_url").orEmpty(),
                      caption = node.optJSONObject("caption")?.optString("text").orEmpty(),
                      isReel = items.any { it.kind == MediaKind.VIDEO },
                      items = items,
                      sourceUrl = source
                  )
              }

              private fun apiNodeToItem(node: JSONObject, id: String): MediaItem {
                  val isVideo = node.optInt("media_type") == 2 || node.has("video_versions")
                  val thumb = node.optJSONObject("image_versions2")
                      ?.optJSONArray("candidates")?.optJSONObject(0)?.optString("url").orEmpty()

                  val variants = mutableListOf<MediaVariant>()
                  val arr = if (isVideo) node.optJSONArray("video_versions")
                  else node.optJSONObject("image_versions2")?.optJSONArray("candidates")
                  if (arr != null) {
                      for (i in 0 until arr.length()) {
                          val v = arr.optJSONObject(i) ?: continue
                          val url = v.optString("url")
                          if (url.isBlank()) continue
                          val h = v.optInt("height")
                          variants += MediaVariant(
                              if (variants.isEmpty()) "Original (Best Quality)" else labelFor(h),
                              url, v.optInt("width"), h
                          )
                      }
                  }
                  if (variants.isEmpty() && thumb.isNotBlank()) {
                      variants += MediaVariant("Original (Best Quality)", thumb)
                  }

                  return MediaItem(
                      id = id,
                      kind = if (isVideo) MediaKind.VIDEO else MediaKind.PHOTO,
                      thumbnailUrl = thumb,
                      variants = variants.distinctBy { it.url },
                      durationSec = node.optDouble("video_duration", 0.0)
                  )
              }

              // ------------------------------------------------------------ strategy 2/3

              private fun viaGraphqlPost(code: String, source: String): ResolvedPost {
                  val form = FormBody.Builder()
                      .add("doc_id", DOC_ID)
                      .add("variables", JSONObject().put("shortcode", code).toString())
                      .build()
                  val req = baseRequest(
                      "https://www.instagram.com/graphql/query",
                      referer = "https://www.instagram.com/p/$code/"
                  ).post(form)
                      .header("Content-Type", "application/x-www-form-urlencoded")
                      .header("Origin", "https://www.instagram.com")
                      .build()
                  return parseShortcodeMedia(graphqlMedia(execute(req)), code, source)
              }

              private fun viaGraphqlGet(code: String, source: String): ResolvedPost {
                  val vars = java.net.URLEncoder.encode(
                      JSONObject().put("shortcode", code).toString(), "UTF-8"
                  )
                  val body = getText(
                      "https://www.instagram.com/graphql/query/?doc_id=$DOC_ID&variables=$vars",
                      referer = "https://www.instagram.com/p/$code/"
                  )
                  return parseShortcodeMedia(graphqlMedia(body), code, source)
              }

              private fun graphqlMedia(text: String): JSONObject =
                  JSONObject(text).optJSONObject("data")
                      ?.let { it.optJSONObject("xdt_shortcode_media") ?: it.optJSONObject("shortcode_media") }
                      ?: error("login wall")

              private fun parseShortcodeMedia(node: JSONObject, code: String, source: String): ResolvedPost {
                  val owner = node.optJSONObject("owner")
                  val caption = node.optJSONObject("edge_media_to_caption")
                      ?.optJSONArray("edges")?.optJSONObject(0)
                      ?.optJSONObject("node")?.optString("text").orEmpty()

                  val items = mutableListOf<MediaItem>()
                  val sidecar = node.optJSONObject("edge_sidecar_to_children")?.optJSONArray("edges")
                  if (sidecar != null && sidecar.length() > 0) {
                      for (i in 0 until sidecar.length()) {
                          sidecar.optJSONObject(i)?.optJSONObject("node")?.let { child ->
                              items += gqlNodeToItem(child, "$code-${i + 1}")
                          }
                      }
                  } else {
                      items += gqlNodeToItem(node, code)
                  }

                  return ResolvedPost(
                      shortcode = code,
                      username = owner?.optString("username").orEmpty().ifBlank { "instagram" },
                      avatarUrl = owner?.optString("profile_pic_url").orEmpty(),
                      caption = caption,
                      isReel = node.optBoolean("is_video"),
                      items = items,
                      sourceUrl = source
                  )
              }

              private fun gqlNodeToItem(node: JSONObject, id: String): MediaItem {
                  val isVideo = node.optBoolean("is_video")
                  val thumb = node.optString("display_url").ifBlank {
                      node.optJSONArray("display_resources")?.lastObject()?.optString("src").orEmpty()
                  }
                  val dims = node.optJSONObject("dimensions")
                  val variants = mutableListOf<MediaVariant>()

                  if (isVideo) {
                      node.optString("video_url").takeIf { it.isNotBlank() }?.let {
                          variants += MediaVariant(
                              "Original (Best Quality)", it,
                              dims?.optInt("width") ?: 0, dims?.optInt("height") ?: 0
                          )
                      }
                      node.optJSONArray("video_resources")?.let { arr ->
                          for (i in 0 until arr.length()) {
                              val v = arr.optJSONObject(i) ?: continue
                              val src = v.optString("src")
                              if (src.isNotBlank() && variants.none { it.url == src }) {
                                  variants += MediaVariant(labelFor(v.optInt("height")), src,
                                      v.optInt("width"), v.optInt("height"))
                              }
                          }
                      }
                  } else {
                      node.optJSONArray("display_resources")?.let { arr ->
                          for (i in arr.length() - 1 downTo 0) {
                              val v = arr.optJSONObject(i) ?: continue
                              val src = v.optString("src")
                              if (src.isBlank()) continue
                              val h = v.optInt("config_height")
                              variants += MediaVariant(
                                  if (variants.isEmpty()) "Original (Best Quality)" else labelFor(h),
                                  src, v.optInt("config_width"), h
                              )
                          }
                      }
                      if (variants.isEmpty() && thumb.isNotBlank()) {
                          variants += MediaVariant("Original (Best Quality)", thumb)
                      }
                  }

                  return MediaItem(
                      id = id,
                      kind = if (isVideo) MediaKind.VIDEO else MediaKind.PHOTO,
                      thumbnailUrl = thumb,
                      variants = variants.distinctBy { it.url },
                      durationSec = node.optDouble("video_duration", 0.0)
                  )
              }

              // -------------------------------------------------------------- strategy 4

              private fun viaEmbed(code: String, source: String): ResolvedPost {
                  val html = getText(
                      "https://www.instagram.com/p/$code/embed/captioned/",
                      referer = "https://www.instagram.com/"
                  )

                  Regex("""\\"gql_data\\":(\{.*?\})\s*,\\"fbid""", RegexOption.DOT_MATCHES_ALL)
                      .find(html)?.groupValues?.get(1)?.let { blob ->
                          runCatching {
                              JSONObject(unescape(blob)).optJSONObject("shortcode_media")
                          }.getOrNull()?.let { return parseShortcodeMedia(it, code, source) }
                      }

                  // Logged-out embeds sometimes inline only the raw .mp4 link, so scan for that too.
                  val clean = unescape(html)
                  val videoUrl = Regex(""""video_url":"([^"]+)"""").find(clean)?.groupValues?.get(1)
                      ?: Regex("""https://[^"'\s\\]+\.mp4[^"'\s\\]*""").find(clean)?.value
                  val imageUrl = Regex("""class="EmbeddedMediaImage"[^>]*src="(.*?)"""")
                      .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }
                      ?: Regex(""""display_url":"(.*?)"""").find(html)?.groupValues?.get(1)?.let { unescape(it) }
                  val user = Regex("""class="UsernameText">(.*?)<""").find(html)?.groupValues?.get(1).orEmpty()

                  val item = when {
                      videoUrl != null -> MediaItem(
                          code, MediaKind.VIDEO, imageUrl.orEmpty(),
                          listOf(MediaVariant("Original (Best Quality)", videoUrl))
                      )
                      !imageUrl.isNullOrBlank() -> MediaItem(
                          code, MediaKind.PHOTO, imageUrl,
                          listOf(MediaVariant("Original (Best Quality)", imageUrl))
                      )
                      else -> error("no media in embed")
                  }
                  return ResolvedPost(code, user.ifBlank { "instagram" }, "", "", videoUrl != null, listOf(item), source)
              }

              // ------------------------------------------------- strategy 5 (page JSON)

              /** Scrapes the post page itself for the inlined media JSON or any .mp4 URL. */
              private fun viaPageJson(code: String, source: String): ResolvedPost {
                  val html = unescape(
                      getText("https://www.instagram.com/p/$code/", referer = "https://www.google.com/")
                  )

                  Regex(""""shortcode_media":(\{.+?\}),"viewer"""", RegexOption.DOT_MATCHES_ALL)
                      .find(html)?.groupValues?.get(1)?.let { blob ->
                          runCatching { JSONObject(blob) }.getOrNull()
                              ?.let { return parseShortcodeMedia(it, code, source) }
                      }

                  val video = Regex(""""video_url":"([^"]+\.mp4[^"]*)"""").find(html)?.groupValues?.get(1)
                      ?: Regex("""https://[^"'\s\\]+\.mp4[^"'\s\\]*""").find(html)?.value
                  val image = Regex(""""display_url":"([^"]+)"""").find(html)?.groupValues?.get(1)
                  val user = Regex(""""owner":\{[^}]*"username":"([^"]+)"""").find(html)?.groupValues?.get(1)
                      ?: "instagram"

                  val item = when {
                      !video.isNullOrBlank() -> MediaItem(
                          code, MediaKind.VIDEO, image.orEmpty(),
                          listOf(MediaVariant("Original (Best Quality)", video))
                      )
                      !image.isNullOrBlank() -> MediaItem(
                          code, MediaKind.PHOTO, image,
                          listOf(MediaVariant("Original (Best Quality)", image))
                      )
                      else -> error("no media json on page")
                  }
                  return ResolvedPost(code, user, "", "", !video.isNullOrBlank(), listOf(item), source)
              }

              // ------------------------------------------- strategy 6 (public mirrors)

              /**
               * Public Instagram embed proxies. They fetch the post server-side (with their
               * own residential IPs) and hand back the direct CDN media, so they work for
               * users who are NOT logged in — which is the normal case for this app.
               */
              private val MIRRORS = listOf(
                  "d.oginstagram.com",
                  "c.instagramfix.com",
                  "d.kkinstagram.com",
                  "d.ddinstagram.com",
                  "d.vxinstagram.com",
                  "instagramez.com"
              )

              private fun viaMirror(host: String, code: String, isReel: Boolean, source: String): ResolvedPost {
                  val path = if (isReel) "reel" else "p"
                  val req = Request.Builder()
                      .url("https://$host/$path/$code/")
                      .header("User-Agent", Net.UA)
                      .header("Accept", "*/*")
                      .build()

                  Net.client.newCall(req).execute().use { resp ->
                      if (!resp.isSuccessful) error("HTTP ${resp.code}")
                      val finalUrl = resp.request.url.toString()
                      val type = resp.header("Content-Type").orEmpty()

                      // Most "d." hosts just 302 straight to the .mp4 / .jpg on the CDN.
                      if (type.startsWith("video/") || finalUrl.contains(".mp4")) {
                          return singleItemPost(code, MediaKind.VIDEO, finalUrl, finalUrl, source, host)
                      }
                      if (type.startsWith("image/") ||
                          Regex("""\.(jpg|jpeg|png|webp)(\?|$)""").containsMatchIn(finalUrl)
                      ) {
                          return singleItemPost(code, MediaKind.PHOTO, finalUrl, finalUrl, source, host)
                      }

                      val html = resp.body?.string().orEmpty()
                      val video = metaOf(html, "og:video") ?: metaOf(html, "og:video:secure_url")
                          ?: Regex("""https://[^"'\s\\]+\.mp4[^"'\s\\]*""").find(html)?.value
                      val image = metaOf(html, "og:image")
                      return when {
                          !video.isNullOrBlank() ->
                              singleItemPost(code, MediaKind.VIDEO, video, image.orEmpty(), source, host)
                          !image.isNullOrBlank() ->
                              singleItemPost(code, MediaKind.PHOTO, image, image, source, host)
                          else -> error("no media")
                      }
                  }
              }

              private fun singleItemPost(
                  code: String,
                  kind: MediaKind,
                  url: String,
                  thumb: String,
                  source: String,
                  username: String
              ) = ResolvedPost(
                  shortcode = code,
                  username = username,
                  avatarUrl = "",
                  caption = "",
                  isReel = kind == MediaKind.VIDEO,
                  items = listOf(
                      MediaItem(code, kind, thumb, listOf(MediaVariant("Original (Best Quality)", url)))
                  ),
                  sourceUrl = source
              )

              private fun metaOf(html: String, prop: String): String? =
                  Regex("""<meta[^>]+property=["']$prop["'][^>]+content=["'](.*?)["']""")
                      .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }
                      ?: Regex("""<meta[^>]+content=["'](.*?)["'][^>]+property=["']$prop["']""")
                          .find(html)?.groupValues?.get(1)?.let { htmlUnescape(it) }

              // -------------------------------------------------------------- strategy 7

              private fun viaOpenGraph(code: String, source: String): ResolvedPost {
                  val html = getText("https://www.instagram.com/p/$code/", referer = "https://www.google.com/")
                  fun meta(prop: String) = metaOf(html, prop)

                  val video = meta("og:video") ?: meta("og:video:secure_url")
                  val image = meta("og:image")
                  val title = meta("og:title").orEmpty()
                  val user = Regex("""@([A-Za-z0-9_.]+)""").find(title)?.groupValues?.get(1) ?: "instagram"

                  val item = when {
                      !video.isNullOrBlank() -> MediaItem(
                          code, MediaKind.VIDEO, image.orEmpty(),
                          listOf(MediaVariant("Original (Best Quality)", video))
                      )
                      !image.isNullOrBlank() -> MediaItem(
                          code, MediaKind.PHOTO, image,
                          listOf(MediaVariant("Original (Best Quality)", image))
                      )
                      else -> error("no og tags (login wall)")
                  }
                  return ResolvedPost(code, user, "", title, !video.isNullOrBlank(), listOf(item), source)
              }

              // ------------------------------------------------------------------ http

              private fun baseRequest(url: String, referer: String, appUa: Boolean = false): Request.Builder {
                  val b = Request.Builder()
                      .url(url)
                      .header("User-Agent", if (appUa) Net.APP_UA else Net.UA)
                      .header("Accept", "*/*")
                      .header("Accept-Language", "en-US,en;q=0.9")
                      .header("X-IG-App-ID", Net.IG_APP_ID)
                      .header("X-ASBD-ID", "129477")
                      .header("X-IG-WWW-Claim", "0")
                      .header("X-Requested-With", "XMLHttpRequest")
                      .header("Sec-Fetch-Site", "same-origin")
                      .header("Sec-Fetch-Mode", "cors")
                      .header("Referer", referer)
                  val cookie = Net.cookieHeader()
                  if (cookie.isNotBlank()) b.header("Cookie", cookie)
                  return b
              }

              private fun execute(req: Request): String {
                  Net.client.newCall(req).execute().use { resp ->
                      val text = resp.body?.string().orEmpty()
                      if (!resp.isSuccessful) error("HTTP ${resp.code}")
                      if (text.isBlank()) error("empty body")
                      return text
                  }
              }

              private fun getText(url: String, referer: String = "https://www.instagram.com/", appUa: Boolean = false): String =
                  execute(baseRequest(url, referer, appUa).get().build())

              private fun finalUrlOf(url: String): String {
                  Net.client.newCall(baseRequest(url, "https://www.instagram.com/").get().build())
                      .execute().use { return it.request.url.toString() }
              }

              /** Resolve the real file size with a HEAD request (for the quality picker). */
              suspend fun contentLength(url: String): Long = withContext(Dispatchers.IO) {
                  runCatching {
                      val req = Request.Builder().url(url).head()
                          .header("User-Agent", Net.UA)
                          .header("Referer", "https://www.instagram.com/")
                          .build()
                      Net.client.newCall(req).execute().use { it.header("Content-Length")?.toLong() ?: 0L }
                  }.getOrDefault(0L)
              }

              // --------------------------------------------------------------- helpers

              /** Instagram shortcodes are just base64url-encoded media ids. */
              fun mediaIdOf(shortcode: String): String {
                  val alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
                  var id = java.math.BigInteger.ZERO
                  val base = java.math.BigInteger.valueOf(64)
                  shortcode.takeWhile { alphabet.indexOf(it) >= 0 }.forEach { c ->
                      id = id.multiply(base).add(java.math.BigInteger.valueOf(alphabet.indexOf(c).toLong()))
                  }
                  return id.toString()
              }

              private fun labelFor(height: Int): String = when {
                  height >= 1080 -> "1080p (HD)"
                  height >= 720 -> "720p (Good)"
                  height >= 480 -> "480p (Small)"
                  height > 0 -> "${height}p"
                  else -> "Alternate"
              }

              private fun unescape(s: String): String =
                  s.replace("\\\\u0026", "&").replace("\\u0026", "&")
                      .replace("\\\\/", "/").replace("\\/", "/")
                      .replace("\\\\\"", "\"").replace("\\\"", "\"")

              private fun htmlUnescape(s: String): String =
                  s.replace("&amp;", "&").replace("&quot;", "\"").replace("&#039;", "'")
                      .replace("&lt;", "<").replace("&gt;", ">")

              private fun JSONArray.lastObject(): JSONObject? =
                  if (length() == 0) null else optJSONObject(length() - 1)
          }
