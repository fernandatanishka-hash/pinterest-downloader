                  ) {
                      Box(
                          Modifier.size(52.dp).clip(RoundedCornerShape(12.dp)).background(InkCard2),
                          contentAlignment = Alignment.Center
                      ) {
                          AsyncImage(
                              model = record.localUri.ifBlank { record.thumbnailUrl },
                              contentDescription = null,
                              modifier = Modifier.fillMaxSize().clip(RoundedCornerShape(12.dp)),
                              contentScale = androidx.compose.ui.layout.ContentScale.Crop
                          )
                          if (record.kind == MediaKind.VIDEO) {
                              Icon(Icons.Default.PlayArrow, null, tint = Color.White.copy(alpha = .9f))
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(
                              record.fileName,
                              color = TextHi,
                              maxLines = 1,
                              style = MaterialTheme.typography.bodyMedium
                          )
                          Text(
                              "${formatSize(record.sizeBytes)} • ${timeAgo(record.createdAt)}",
                              color = TextLo,
                              style = MaterialTheme.typography.bodySmall
                          )
                      }
                      IconButton(onClick = { vm.store.toggleFavorite(record.id) }) {
                          Icon(
                              if (record.favorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder,
                              null,
                              tint = if (record.favorite) NeonPink else TextLo
                          )
                      }
                      Box {
                          IconButton(onClick = { menuOpen = true }) {
                              Icon(Icons.Default.MoreVert, null, tint = TextLo)
                          }
                          DropdownMenu(
                              expanded = menuOpen,
                              onDismissRequest = { menuOpen = false },
                              containerColor = InkCard2
                          ) {
                              DropdownMenuItem(
                                  text = { Text("Open", color = TextHi) },
                                  leadingIcon = { Icon(Icons.Default.OpenInNew, null, tint = NeonPurple) },
                                  onClick = {
                                      menuOpen = false
                                      MediaActions.open(context, record) { vm.showToast(it) }
                                  }
                              )
                              DropdownMenuItem(
                                  text = { Text("Share", color = TextHi) },
                                  leadingIcon = { Icon(Icons.Default.Share, null, tint = NeonPurple) },
                                  onClick = {
                                      menuOpen = false
                                      MediaActions.share(context, record) { vm.showToast(it) }
                                  }
                              )
                              HorizontalDivider(color = Stroke)
                              DropdownMenuItem(
                                  text = { Text("Remove from list", color = TextHi) },
                                  leadingIcon = { Icon(Icons.Default.PlaylistRemove, null, tint = TextLo) },
                                  onClick = {
                                      menuOpen = false
                                      vm.store.remove(record.id)
                                      vm.showToast("Removed from list (file kept in gallery)")
                                  }
                              )
                              DropdownMenuItem(
                                  text = { Text("Delete file", color = NeonRose) },
                                  leadingIcon = { Icon(Icons.Default.Delete, null, tint = NeonRose) },
                                  onClick = {
                                      menuOpen = false
                                      onDelete?.invoke() ?: run {
                                          val ok = MediaActions.delete(context, record)
                                          vm.store.remove(record.id)
                                          vm.showToast(if (ok) "File deleted" else "Removed (file not found)")
                                      }
                                  }
                              )
                          }
                      }
                  }
              }
          }
