          @Composable
          private fun AppRoot(vm: MainViewModel) {
              val navController = rememberNavController()
              val backStack by navController.currentBackStackEntryAsState()
              val currentRoute = backStack?.destination?.route
              val state by vm.state.collectAsState()
              val toast by vm.toast.collectAsState()
              val snackbar = remember { SnackbarHostState() }

              // Jump to the preview screen as soon as a link starts resolving.
              LaunchedEffect(state) {
                  if (state is ResolveState.Loading || state is ResolveState.Success || state is ResolveState.Error) {
                      if (currentRoute != "preview") navController.navigate("preview")
