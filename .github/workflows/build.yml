          cat > app/src/main/java/com/flowsnap/app/ui/theme/Theme.kt <<'FLOWSNAP_EOF'
          package com.flowsnap.app.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.staticCompositionLocalOf
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp

          // ---------------------------------------------------------------- raw palette

          // dark surfaces
          private val InkDark = Color(0xFF0B0718)
          private val CardDark = Color(0xFF15102B)
          private val Card2Dark = Color(0xFF1C1540)
          private val StrokeDark = Color(0xFF2A2152)
          private val TextHiDark = Color(0xFFF2EEFF)
          private val TextLoDark = Color(0xFF9A92BF)

          // light surfaces
          private val InkLight = Color(0xFFF7F5FF)
          private val CardLight = Color(0xFFFFFFFF)
          private val Card2Light = Color(0xFFEFEBFF)
          private val StrokeLight = Color(0xFFDFD8F5)
          private val TextHiLight = Color(0xFF1A1033)
          private val TextLoLight = Color(0xFF6C6490)

          // accents
          val NeonViolet = Color(0xFF7C3AED)
          val NeonPurpleRaw = Color(0xFFA855F7)
          val NeonPinkRaw = Color(0xFFE935C1)
          val NeonRose = Color(0xFFFB3B6E)
          val NeonBlue = Color(0xFF3B82F6)
          val NeonCyan = Color(0xFF22D3EE)
          val NeonMagenta = Color(0xFFFF4D9D)

          /** One selectable accent (Settings → App theme). */
          data class Accent(val name: String, val primary: Color, val secondary: Color, val gradient: Brush)

          private val PurpleAccent = Accent(
              "Purple", NeonPurpleRaw, NeonPinkRaw,
              Brush.horizontalGradient(listOf(NeonViolet, NeonPinkRaw, NeonRose))
          )
          private val PinkAccent = Accent(
              "Pink", NeonMagenta, NeonRose,
              Brush.horizontalGradient(listOf(NeonMagenta, NeonRose, Color(0xFFFF7A45)))
          )
          private val BlueAccent = Accent(
              "Blue", NeonBlue, NeonCyan,
              Brush.horizontalGradient(listOf(Color(0xFF4F46E5), NeonBlue, NeonCyan))
          )

          val ACCENTS = listOf(PurpleAccent, PinkAccent, BlueAccent)

          fun accentFor(name: String): Accent = ACCENTS.firstOrNull { it.name == name } ?: PurpleAccent

          private val LocalBrandGradient = staticCompositionLocalOf { PurpleAccent.gradient }

          // ------------------------------------------------- theme-aware color accessors
          // Used all over the UI, so light mode and the accent switcher work everywhere.

          val Ink: Color @Composable get() = MaterialTheme.colorScheme.background
          val InkCard: Color @Composable get() = MaterialTheme.colorScheme.surface
          val InkCard2: Color @Composable get() = MaterialTheme.colorScheme.surfaceVariant
          val Stroke: Color @Composable get() = MaterialTheme.colorScheme.outline
          val TextHi: Color @Composable get() = MaterialTheme.colorScheme.onSurface
          val TextLo: Color @Composable get() = MaterialTheme.colorScheme.onSurfaceVariant
          val NeonPurple: Color @Composable get() = MaterialTheme.colorScheme.primary
          val NeonPink: Color @Composable get() = MaterialTheme.colorScheme.secondary
          val BrandGradient: Brush @Composable get() = LocalBrandGradient.current

          private val AppTypography = Typography(
              headlineSmall = TextStyle(fontWeight = FontWeight.Bold, fontSize = 24.sp),
              titleLarge = TextStyle(fontWeight = FontWeight.Bold, fontSize = 20.sp),
              titleMedium = TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 16.sp),
              bodyMedium = TextStyle(fontSize = 14.sp),
              bodySmall = TextStyle(fontSize = 12.sp),
              labelSmall = TextStyle(fontWeight = FontWeight.Medium, fontSize = 11.sp)
          )

          @Composable
          fun FlowSnapTheme(
              darkTheme: Boolean = true,
              themeName: String = "Purple",
              content: @Composable () -> Unit
          ) {
              val accent = accentFor(themeName)

              val colors = if (darkTheme) {
                  darkColorScheme(
                      primary = accent.primary,
                      onPrimary = Color.White,
                      secondary = accent.secondary,
                      onSecondary = Color.White,
                      background = InkDark,
                      onBackground = TextHiDark,
                      surface = CardDark,
                      onSurface = TextHiDark,
                      surfaceVariant = Card2Dark,
                      onSurfaceVariant = TextLoDark,
                      outline = StrokeDark,
                      error = NeonRose,
                      onError = Color.White
                  )
              } else {
                  lightColorScheme(
                      primary = accent.primary,
                      onPrimary = Color.White,
                      secondary = accent.secondary,
                      onSecondary = Color.White,
                      background = InkLight,
                      onBackground = TextHiLight,
                      surface = CardLight,
                      onSurface = TextHiLight,
                      surfaceVariant = Card2Light,
                      onSurfaceVariant = TextLoLight,
                      outline = StrokeLight,
                      error = NeonRose,
                      onError = Color.White
                  )
              }

              CompositionLocalProvider(LocalBrandGradient provides accent.gradient) {
                  MaterialTheme(
                      colorScheme = colors,
                      typography = AppTypography,
                      content = content
                  )
              }
          }
          FLOWSNAP_EOF


      # A cached debug keystore keeps the APK signature identical between runs,
      # so you can install updates over the old app instead of uninstalling.
      - name: Reuse signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flowsnap-signing-key-v1

      - name: Show generated tree
        working-directory: build-src
        run: find . -type f | sort

      # Release build (not debug): no debuggable flag, no Compose debug
      # instrumentation -> noticeably smoother scrolling and faster startup.
      - name: Build APK
        working-directory: build-src
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp build-src/app/build/outputs/apk/release/app-release.apk artifacts/FlowSnap.apk
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowSnap-apk
          path: artifacts/FlowSnap.apk
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/FlowSnap.apk
