          package com.flowsnap.app.data

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow

          data class Settings(
              val askBeforeDownloading: Boolean = true,
              val wifiOnly: Boolean = false,
              val autoSaveToGallery: Boolean = true,
              val darkMode: Boolean = true,
              val theme: String = "Purple",
              val autoDetectClipboard: Boolean = true,
              val sessionId: String = ""
          )

          class Prefs(context: Context) {
              private val sp = context.getSharedPreferences("flowsnap", Context.MODE_PRIVATE)
              val state = MutableStateFlow(read())

              init {
                  Net.sessionId = state.value.sessionId
              }

              private fun read() = Settings(
                  askBeforeDownloading = sp.getBoolean("ask", true),
                  wifiOnly = sp.getBoolean("wifi", false),
                  autoSaveToGallery = sp.getBoolean("gallery", true),
                  darkMode = sp.getBoolean("dark", true),
                  theme = sp.getString("theme", "Purple") ?: "Purple",
                  autoDetectClipboard = sp.getBoolean("clip", true),
                  sessionId = sp.getString("sessionid", "") ?: ""
              )

              fun update(block: (Settings) -> Settings) {
                  val s = block(state.value)
                  sp.edit()
                      .putBoolean("ask", s.askBeforeDownloading)
                      .putBoolean("wifi", s.wifiOnly)
                      .putBoolean("gallery", s.autoSaveToGallery)
                      .putBoolean("dark", s.darkMode)
                      .putString("theme", s.theme)
                      .putBoolean("clip", s.autoDetectClipboard)
                      .putString("sessionid", s.sessionId)
                      .apply()
                  state.value = s
                  Net.sessionId = s.sessionId
              }
          }
