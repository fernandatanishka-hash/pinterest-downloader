              const val IG_APP_ID = "936619743392459"

              /**
               * Optional `sessionid` cookie. Empty = fully anonymous (public posts only).
               * Set from Settings; enables Stories, Highlights and private-but-followed posts.
               */
              @Volatile
              var sessionId: String = ""

              fun cookieHeader(): String =
                  if (sessionId.isBlank()) "" else "sessionid=${sessionId.trim()};"

