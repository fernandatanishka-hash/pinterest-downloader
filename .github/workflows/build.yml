          package com.flowsnap.app

          import android.app.Application
          import coil.ImageLoader
          import coil.ImageLoaderFactory
          import coil.decode.VideoFrameDecoder
          import coil.disk.DiskCache
          import coil.memory.MemoryCache
          import coil.request.CachePolicy
          import com.flowsnap.app.data.Net
          import okhttp3.OkHttpClient

          class FlowSnapApp : Application(), ImageLoaderFactory {

              /**
               * Shared Coil loader:
               *  - VideoFrameDecoder so downloaded .mp4 files get a real thumbnail
               *  - Instagram CDN needs a browser UA + Referer or it answers 403 (blank thumbs)
               *  - memory + disk cache so scrolling lists never re-decode
               */
              override fun newImageLoader(): ImageLoader =
                  ImageLoader.Builder(this)
                      .components { add(VideoFrameDecoder.Factory()) }
                      .okHttpClient {
                          OkHttpClient.Builder()
                              .addInterceptor { chain ->
                                  chain.proceed(
                                      chain.request().newBuilder()
                                          .header("User-Agent", Net.UA)
                                          .header("Referer", "https://www.instagram.com/")
                                          .build()
                                  )
                              }
                              .build()
                      }
                      .memoryCache { MemoryCache.Builder(this).maxSizePercent(0.25).build() }
                      .diskCache {
                          DiskCache.Builder()
                              .directory(cacheDir.resolve("image_cache"))
                              .maxSizeBytes(64L * 1024 * 1024)
                              .build()
                      }
                      .diskCachePolicy(CachePolicy.ENABLED)
                      .crossfade(false)
                      .respectCacheHeaders(false)
                      .build()
          }
