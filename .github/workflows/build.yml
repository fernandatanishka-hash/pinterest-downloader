          @Composable
          fun StorageScreen(vm: MainViewModel, onBack: () -> Unit) {
              val items by vm.store.items.collectAsState()
              val used = remember(items) { items.sumOf { it.sizeBytes } }
              val largest = remember(items) { items.sortedByDescending { it.sizeBytes }.take(5) }

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp).verticalScroll(rememberScrollState())) {
                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null, tint = TextHi) }
                      Text("Storage", style = MaterialTheme.typography.titleLarge, color = TextHi)
                  }
                  Spacer(Modifier.height(16.dp))
                  NeonCard {
                      Column(Modifier.padding(18.dp)) {
                          Text(formatSize(used), color = TextHi, style = MaterialTheme.typography.headlineSmall)
                          Text("used by FlowSnap · ${items.size} files", color = TextLo,
                              style = MaterialTheme.typography.bodySmall)
                          Spacer(Modifier.height(12.dp))
                          LinearProgressIndicator(
                              progress = { (used / (2L * 1024 * 1024 * 1024).toFloat()).coerceIn(0f, 1f) },
                              modifier = Modifier.fillMaxWidth(),
                              color = NeonPink,
                              trackColor = Stroke
                          )
                      }
                  }

                  Spacer(Modifier.height(18.dp))
                  SectionTitle("LARGEST DOWNLOADS")
                  Spacer(Modifier.height(8.dp))
