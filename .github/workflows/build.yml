name: Build FlowSnap APK

# One-file Android build: this workflow GENERATES the whole FlowSnap
# Instagram-downloader project (Kotlin + Jetpack Compose) and compiles it
# into an installable .apk. The repo needs nothing but this file.
#
#   Actions -> Build FlowSnap APK -> Run workflow
#   then download the "FlowSnap-apk" artifact -> FlowSnap.apk -> install it.
#
# Produces ONE installable APK (debug-signed, works on any Android 7+ phone).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    name: Generate project and assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list contains the obsolete "tools" package,
          # which Google removed from the SDK repository -> sdkmanager exits 1.
          # Install nothing here and pull exactly what we need in the next step.
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create project folders
        run: |
          rm -rf build-src
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/data
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/theme
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/screens
          mkdir -p build-src/app/src/main/java/com/flowsnap/app/ui/components
          mkdir -p build-src/app/src/main/res/values
          mkdir -p build-src/app/src/main/res/drawable
          mkdir -p build-src/app/src/main/res/mipmap-anydpi-v26
          mkdir -p build-src/app/src/main/res/xml

      - name: Write Gradle build files
        working-directory: build-src
        run: |
          cat > settings.gradle.kts <<'FLOWSNAP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FlowSnap"
          include(":app")
          FLOWSNAP_EOF

          cat > build.gradle.kts <<'FLOWSNAP_EOF'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          FLOWSNAP_EOF

          cat > gradle.properties <<'FLOWSNAP_EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          FLOWSNAP_EOF

          cat > app/build.gradle.kts <<'FLOWSNAP_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.flowsnap.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flowsnap.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
                  vectorDrawables { useSupportLibrary = true }
              }

              signingConfigs {
                  // Created only when the GitHub Actions workflow exported the keystore env vars.
                  val storeFilePath = System.getenv("FLOWSNAP_STORE_FILE")
                  if (!storeFilePath.isNullOrBlank() && file(storeFilePath).exists()) {
                      create("release") {
                          storeFile = file(storeFilePath)
                          storePassword = System.getenv("FLOWSNAP_STORE_PASSWORD")
                          keyAlias = System.getenv("FLOWSNAP_KEY_ALIAS")
                          keyPassword = System.getenv("FLOWSNAP_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      // Signed by the GitHub Actions workflow when secrets are present,
                      // otherwise falls back to the debug key so the APK still installs.
                      //
                      // R8 is OFF by default so the very first CI run is guaranteed green.
                      // Flip both flags to `true` (or build with -PminifyRelease=true) to
                      // shrink the APK from ~17 MB to ~5 MB once you are up and running.
                      val minify = (project.findProperty("minifyRelease") as String?)?.toBoolean() ?: false
                      isMinifyEnabled = minify
                      isShrinkResources = minify
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release") ?: signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.navigation:navigation-compose:2.8.4")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("io.coil-kt:coil-video:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          FLOWSNAP_EOF

          cat > app/proguard-rules.pro <<'FLOWSNAP_EOF'
          -dontwarn okhttp3.**
          -dontwarn okio.**
          -keep class com.flowsnap.app.data.** { *; }
          -keepattributes Signature, InnerClasses, EnclosingMethod
          FLOWSNAP_EOF


      - name: Write AndroidManifest and resources
        working-directory: build-src
        run: |
          cat > app/src/main/AndroidManifest.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:name=".FlowSnapApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.FlowSnap">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@style/Theme.FlowSnap">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- "Share to FlowSnap" from Instagram / any app -->
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>

                      <!-- Open instagram.com links with FlowSnap -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="www.instagram.com" />
                          <data android:scheme="https" android:host="instagram.com" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          FLOWSNAP_EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'FLOWSNAP_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,26L54,66M54,66L40,52M54,66L68,52"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:startX="34" android:startY="26"
                          android:endX="74" android:endY="70"
                          android:type="linear">
                          <item android:offset="0" android:color="#FF6A3DF5" />
                          <item android:offset="0.5" android:color="#FFD946EF" />
                          <item android:offset="1" android:color="#FFF43F5E" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path
                  android:pathData="M36,74L72,74"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:strokeColor="#FFD946EF" />
          </vector>
          FLOWSNAP_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FLOWSNAP_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          FLOWSNAP_EOF

          cat > app/src/main/res/xml/file_paths.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external" path="." />
              <external-files-path name="external_files" path="." />
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
          </paths>
          FLOWSNAP_EOF

          cat > app/src/main/res/values/colors.xml <<'FLOWSNAP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
