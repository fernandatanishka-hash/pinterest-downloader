          private data class Tab(val route: String, val label: String, val icon: ImageVector)

          /**
           * Switches bottom-bar tabs. Deliberately does NOT use saveState/restoreState:
           * with a single shared graph those restore whatever was pushed on top of a tab
           * (e.g. Downloads opened from Home via "See all"), which made Home reopen
           * Downloads instead of Home.
           */
          private fun NavHostController.switchTab(route: String) {
              navigate(route) {
                  popUpTo(graph.findStartDestination().id) {
                      saveState = false
                      inclusive = false
                  }
                  launchSingleTop = true
                  restoreState = false
              }
          }

          private val TABS = listOf(
