          @Composable
          private fun SessionDialog(current: String, onDismiss: () -> Unit, onSave: (String) -> Unit) {
              var text by remember { mutableStateOf(current) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = InkCard,
                  title = { Text("Instagram session", color = TextHi) },
                  text = {
                      Column {
                          Text(
                              "Log in to instagram.com in a browser, open DevTools → Application → Cookies " +
                                  "and copy the value of `sessionid`.",
                              color = TextLo,
                              style = MaterialTheme.typography.bodySmall
